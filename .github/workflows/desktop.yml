name: Desktop candidates

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.platform }} ${{ matrix.arch }} candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
            builder_args: --mac dmg zip --arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
            builder_args: --mac dmg zip --x64
          - runner: windows-2025
            platform: windows
            arch: x64
            builder_args: --win nsis --x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            builder_args: --linux AppImage --x64
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and build web app
        run: npm run build
      - name: Test local work and integration contracts
        run: npm test
      - name: Bundle desktop and standalone runtime entries
        run: npm run desktop:build
      - name: Generate bundled dependency notices and SBOM
        run: node scripts/license-notices.mjs
      - name: Package candidate without publishing
        run: npx --no-install electron-builder ${{ matrix.builder_args }} --publish never
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb libgtk-3-0 libnss3 libasound2t64
      - name: Exercise the actual installed or extracted distributions
        env:
          ZETTEL_CANDIDATE_ARCH: ${{ matrix.arch }}
          ZETTEL_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a node scripts/verify-desktop-candidate.mjs --linux-sandbox-helper
          else
            node scripts/verify-desktop-candidate.mjs
          fi
      - name: Record checksums and candidate provenance
        if: always()
        env:
          ZETTEL_CANDIDATE_PLATFORM: ${{ matrix.platform }}
          ZETTEL_CANDIDATE_ARCH: ${{ matrix.arch }}
          ZETTEL_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/record-desktop-candidate.mjs
      - name: Upload candidate and checksums
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zettel-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/*.zip
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/SHA256SUMS
            release/artifact-manifest.json
            release/verification/*.json
            release/verification/*.png
            release/THIRD_PARTY_NOTICES.txt
            release/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
